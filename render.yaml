# Render blueprint: creates the web service from this repo without dashboard clicking.
# Usage: push this folder to GitHub, then "New + → Blueprint" in Render, or:
#   render blueprint launch
services:
  - type: web
    name: email-verifier
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 2 --threads 4 --timeout 300 app:app
    envVars:
      - key: HELO_DOMAIN
        value: email-checker.local   # set to a domain you control for better accuracy
