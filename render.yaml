services:
  - type: web
    name: email-verifier
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 2 --threads 4 --timeout 300 app:app
    healthCheckPath: /api/health
    envVars:
      - key: HELO_DOMAIN
        value: email-checker.local   # set to a domain you control for better accuracy
